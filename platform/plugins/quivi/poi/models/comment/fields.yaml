fields:
    target_type:
        label: Tipo target
        type: dropdown
        span: left
    target_id:
        label: Target ID
        span: right
    user_id:
        label: Utente ID
        span: left
        hidden: true
    user_button:
        label: ''
        type: partial
        path: $/quivi/poi/partials/_form_comment_user.htm
        span: left
    parent_id:
        label: Risposta a (ID commento)
        span: right
        trigger:
            action: show
            field: kind
            condition: value[comment]
    kind:
        label: Tipo
        type: dropdown
        span: left
    rating:
        label: Rating (1-5)
        type: number
        span: right
        trigger:
            action: show
            field: kind
            condition: value[review]
    comment_text:
        label: Testo commento
        type: textarea
        required: true
    reports_count:
        label: Numero segnalazioni
        type: number
        span: left
        disabled: true
    is_hidden:
        label: Nascosto automaticamente
        type: switch
        span: right
