<?php
$itineraryId = (int) input('itinerary_id');
$backUrl = $itineraryId
    ? Backend::url('quivi/poi/itineraries/update/' . $itineraryId)
    : Backend::url('quivi/poi/itineraries');
?>
<?php Block::put('breadcrumb') ?>
    <ul>
        <li><a href="<?= Backend::url('quivi/poi/itineraries') ?>">Itinerari</a></li>
        <?php if ($itineraryId): ?>
            <li><a href="<?= Backend::url('quivi/poi/itineraries/update/' . $itineraryId) ?>">Itinerario #<?= $itineraryId ?></a></li>
        <?php endif ?>
        <li>Nuova tappa</li>
    </ul>
<?php Block::endPut() ?>

<?php if (!$this->fatalError): ?>

    <?php Block::put('form-contents') ?>
        <div class="layout-row min-size">
            <?= $this->formRenderOutsideFields() ?>
        </div>
        <div class="layout-row">
            <?= $this->formRenderPrimaryTabs() ?>
        </div>
        <div class="form-buttons">
            <div class="loading-indicator-container">
                <button
                    type="submit"
                    data-request="onSave"
                    data-hotkey="ctrl+s, cmd+s"
                    data-load-indicator="Salvataggio..."
                    class="btn btn-primary">
                    Aggiungi tappa
                </button>
                <button
                    type="button"
                    data-request="onSave"
                    data-request-data="close:1"
                    data-hotkey="ctrl+enter, cmd+enter"
                    data-load-indicator="Salvataggio..."
                    class="btn btn-default">
                    Aggiungi e chiudi
                </button>
                <span class="btn-text">
                    oppure <a href="<?= $backUrl ?>">Annulla</a>
                </span>
            </div>
        </div>
    <?php Block::endPut() ?>

    <?php Block::put('form-sidebar') ?>
        <div class="hide-tabs"><?= $this->formRenderSecondaryTabs() ?></div>
    <?php Block::endPut() ?>

    <?php Block::put('body') ?>
        <?= Form::open(['class' => 'layout stretch']) ?>
            <?= $this->makeLayout('form-with-sidebar') ?>
        <?= Form::close() ?>
    <?php Block::endPut() ?>

<?php else: ?>
    <p class="flash-message static error"><?= e($this->fatalError) ?></p>
    <p><a href="<?= $backUrl ?>" class="btn btn-default">Torna</a></p>
<?php endif ?>
